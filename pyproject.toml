[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2singlehtml"
version = "0.2.0"
description = "Convert Markdown files to Sphinx singlehtml"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "tanlinfeng", email = "linfeng.tan@foxmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "click",
    "sphinx",
    "myst-parser",
    "sphinxcontrib-mermaid",
    "sphinx-rtd-theme",
]

[project.scripts]
md2html = "md2html.cli:main"
m2h = "md2html.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md2html"]